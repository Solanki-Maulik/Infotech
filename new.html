<!DOCTYPE html>
<html lang="en">
<head>
    <title>Maulik Solanki | HTML CSS Developer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="logo.png" type="image/x-icon">
    <style>
        :root {
            --primary-color: #F4EFE6;
            --second-color: black;
            --accent-color: #383434;
        }
        
        body {
            margin: 0;
            padding: 10px 0 0 0;
            background-color: var(--primary-color);
            overflow-x: hidden;
            user-select: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* NAVBAR FIXES: Added justify-content and proper gaps instead of big margins */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--primary-color);
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 20px;
        }

        h1 {
            color: var(--second-color);
            font-size: 30px;
            margin: 0;
        }

        .navbar ul {
            display: flex;
            list-style-type: none;
            background-color: white;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
            gap: 15px;
        }

        .navbar li a {
            text-decoration: none;
            color: var(--second-color);
            padding: 5px 10px;
            display: inline-block;
        }

        .navbar li a:hover {
            background-color: #f2f7f5;
            border-radius: 5px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 20px;
        }

        .nav-btn1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 110px;
            height: 40px;
            background-color: var(--second-color);
            color: white;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            border: none;
        }

        .nav-btn1:hover {
            background-color: var(--accent-color);
            color: rgb(233, 223, 223);
        }

        .nav-btn2 {
            width: 50px;
            height: 40px;
            background-color: var(--second-color);
            color: white;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn1_logo {
            height: 12px;
            width: 18px;
        }

        .btn2_logo {
            border-radius: 5px;
            height: 24px;
            width: 24px;
        }

        .nav-btn-link {
            text-decoration: none;
        }

        /* MAIN CONTENT FIX: Changed fixed 1230px to responsive max-width */
        .page-content-intro {
            max-width: 1230px;
            width: 94%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            min-height: 80vh;
            box-sizing: border-box;
        }

        h2 {
            font-size: 50px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 0;
        }

        /* DROPDOWN & UTILITIES */
        .dropdown {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .dropbtn {
            background-color: rgb(230, 241, 230);
            height: 40px;
            width: 100px;
            cursor: pointer;
            border: 1px solid black;
            border-radius: 5px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid black;
            min-width: 120px;
            z-index: 1;
            border-radius: 5px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
        }

        .dropdown-content a {
            display: block;
            text-decoration: none;
            color: black;
            padding: 10px;
            font-size: 16px;
        }

        .dropdown-content a:hover {
            background-color: rgb(231, 234, 240);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* CARD & CUBE LAYOUT FIX */
        .interactive-section {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 40px;
        }

        .container-card {
            display: flex;
            height: 200px;
            width: 230px;
            border-radius: 10px;
            perspective: 2800px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.5s;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            text-align: center;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .front {
            background-color: antiquewhite;
            border-radius: 10px;
        }

        .back {
            background-color: aliceblue;
            transform: rotateY(180deg);
            border-radius: 10px;
        }

        .container-card:hover .card {
            transform: rotateY(180deg);
        }

        .container-cube {
            display: flex;
            width: 230px;
            height: 230px;
        }

        /* FOOTER FIXES */
        .footer {
            display: flex;
            width: 94%;
            max-width: 1230px;
            margin: 20px auto;
            min-height: 30vh;
            padding: 20px;
            border-radius: 15px;
            background-color: white;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .footer-brand {
            width: 40%;
        }

        .footer h3 {
            font-size: 36px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            color: var(--second-color);
        }

        .footer-links-container {
            display: flex;
            width: 50%;
            justify-content: space-around;
        }

        .footer ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .footer p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 22px;
            margin: 0 0 15px 0;
            color: var(--second-color);
            font-weight: bold;
        }

        .footer li {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .footer li a {
            text-decoration: none;
            color: grey;
        }

        .footer li a:hover {
            color: var(--second-color);
        }
    </style>
</head>
